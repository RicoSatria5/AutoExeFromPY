name: Build & Release Python Executables

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  APP_NAME: spamming_tool
  ENTRY_POINT: main.py

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ----------------------------
      # Install dependencies cross-platform
      # ----------------------------
      - name: Install dependencies
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
        shell: pwsh

      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      # ----------------------------
      # Build Executables / App
      # ----------------------------
      - name: Build Windows executable
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name "$env:APP_NAME" "$env:ENTRY_POINT"
          Rename-Item "dist\$env:APP_NAME.exe" "${env:APP_NAME}-windows.exe"
        shell: pwsh

      - name: Build Windows MSI installer
        if: runner.os == 'Windows'
        run: |
          pip install cx_Freeze
          mkdir installer
          echo "[Shortcut]" > installer/wxs-template.wxs
          candle installer\wxs-template.wxs
          light wxs-template.wixobj -o "dist/${env:APP_NAME}-windows.msi"
        shell: pwsh

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          pyinstaller --onefile --name "$APP_NAME" "$ENTRY_POINT"
          mv "dist/$APP_NAME" "dist/${APP_NAME}-linux"
        shell: bash

      - name: Build Linux DEB package
        if: runner.os == 'Linux'
        run: |
          mkdir -p deb/usr/local/bin/
          cp "dist/${APP_NAME}-linux" deb/usr/local/bin/${APP_NAME}
          mkdir -p deb/DEBIAN
          echo "Package: ${APP_NAME}
Version: 1.0
Architecture: amd64
Maintainer: You
Description: ${APP_NAME} Application" > deb/DEBIAN/control
          dpkg-deb --build deb
          mv deb.deb "dist/${APP_NAME}-linux.deb"
        shell: bash

      - name: Build macOS .app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --windowed --onefile --name "$APP_NAME" "$ENTRY_POINT"
          mkdir -p dist/$APP_NAME.app/Contents/MacOS/
          mv dist/$APP_NAME dist/$APP_NAME.app/Contents/MacOS/$APP_NAME
          mv dist/$APP_NAME.app dist/${APP_NAME}-macos.app
        shell: bash

      # ----------------------------
      # Upload artifacts
      # ----------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/*

  # ----------------------------
  # Release Job
  # ----------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Auto-generate changelog from last tag
      - name: Generate changelog
        run: |
          previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "None")
          if [ "$previous_tag" = "None" ]; then
            echo "First release" > CHANGELOG.txt
          else
            git log $previous_tag..HEAD --pretty=format:"• %s" > CHANGELOG.txt
        shell: bash

      # Download build artifacts
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      # Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.txt
          files: builds/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
